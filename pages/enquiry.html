<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Style Clothing | Reserve Item / Inquire</title>
    <link rel="stylesheet" href="../miscellanous/style.css">
</head>
<body>

    <!-- Main Navigation Header -->
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-title">
            <h2>Item Reservation & Stock Query</h2>
            <p>Reserve your size online for in-store pickup or request stock availability.</p>
        </section>

        <!-- Interactive Reservation Form -->
        <section class="form-section">
            <div class="form-container">
                <form action="#" method="POST" class="enquiry-form">
                    
                    <!-- Customer Details -->
                    <fieldset>
                        <legend>Customer Details</legend>
                        
                        <div class="form-group">
                            <label for="fullname">Full Name *</label>
                            <input type="text" id="fullname" name="fullname" placeholder="e.g., Thabo Molefe" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" placeholder="e.g., thabo@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Cell Number *</label>
                            <input type="tel" id="phone" name="phone" placeholder="e.g., 082 123 4567" required>
                        </div>
                    </fieldset>

                    <!-- Product Reservation Fields -->
                    <fieldset>
                        <legend>Item Reservation & Size Selection</legend>

                        <div class="form-group">
                            <label for="category">Product Category *</label>
                            <select id="category" name="category" required>
                                <option value="">-- Select Category --</option>
                                <option value="hoodies">Hoodies & Sweaters</option>
                                <option value="tees">Graphic T-Shirts</option>
                                <option value="pants">Cargo Pants & Denim</option>
                                <option value="shoes">Sneakers & Footwear</option>
                                <option value="accessories">Caps & Bags</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="size">Requested Size *</label>
                            <select id="size" name="size" required>
                                <option value="">-- Select Size --</option>
                                <option value="xs">Extra Small (XS)</option>
                                <option value="s">Small (S)</option>
                                <option value="m">Medium (M)</option>
                                <option value="l">Large (L)</option>
                                <option value="xl">Extra Large (XL)</option>
                                <option value="shoe">Footwear (UK 6 - UK 11)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="message">Item Description / Special Request *</label>
                            <textarea id="message" name="message" rows="5" placeholder="Specify the item name, color preference, or hold duration..." required></textarea>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn btn-primary">Submit Reservation Request</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 Urban Style Clothing. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
